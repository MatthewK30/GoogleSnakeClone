<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Snake - Fortnite Edition</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%;
  font-family: 'Product Sans', 'Google Sans', Arial, sans-serif;
  background: #fff;
  color: #202124;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}
body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  background: #fafafa;
}
#selector {
  width: 100%;
  max-width: 960px;
  height: 100vh;
  padding: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-y: auto;
}
#selector h1 {
  font-size: 64px;
  font-weight: 900;
  letter-spacing: -2px;
  margin-bottom: 4px;
  background: linear-gradient(45deg, #4285F4, #EA4335, #FBBC05, #34A853);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  text-align: center;
}
#selector .subtitle { font-size: 16px; color: #5f6368; margin-bottom: 20px; text-align: center; }
#skinGrid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 12px;
  width: 100%;
  padding: 8px;
  margin-bottom: 80px;
}
.skin-card {
  background: #fff;
  border: 3px solid #e0e0e0;
  border-radius: 12px;
  padding: 10px;
  cursor: pointer;
  transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.skin-card:hover { transform: translateY(-2px); border-color: #4285F4; }
.skin-card.selected {
  border-color: #4285F4;
  box-shadow: 0 0 0 4px rgba(66,133,244,0.25), 0 4px 12px rgba(66,133,244,0.4);
  transform: translateY(-2px);
}
.skin-card canvas { width: 100%; height: 80px; border-radius: 6px; background: #f1f3f4; }
.skin-card .skin-name { margin-top: 8px; font-size: 13px; font-weight: 600; text-align: center; color: #202124; }
#playBtn {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  padding: 16px 64px;
  background: #4285F4;
  color: white;
  border: none;
  border-radius: 32px;
  font-size: 22px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(66,133,244,0.4);
  transition: transform 0.1s, background 0.15s;
  letter-spacing: 1px;
}
#playBtn:hover { background: #3367d6; }
#playBtn:active { transform: translateX(-50%) scale(0.96); }
#game {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100vh;
}
#scoreBar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 14px;
  background: #4a752c;
  color: white;
  border-radius: 8px 8px 0 0;
  font-size: 16px;
  font-weight: 600;
  height: 44px;
}
#scoreBar .left { display: flex; align-items: center; gap: 8px; }
#musicBtn {
  background: rgba(255,255,255,0.2);
  border: none;
  color: white;
  border-radius: 6px;
  padding: 4px 10px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
}
#musicBtn:hover { background: rgba(255,255,255,0.35); }
#gameCanvas { display: block; touch-action: none; border-radius: 0 0 8px 8px; }
#gameOver {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.6);
  align-items: center;
  justify-content: center;
  z-index: 10;
}
#gameOver .panel {
  background: white;
  padding: 32px 28px;
  border-radius: 16px;
  text-align: center;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  max-width: 90%;
  width: 360px;
}
#gameOver h2 { font-size: 32px; margin-bottom: 8px; color: #202124; }
#gameOver .final-score { font-size: 48px; font-weight: 900; color: #4285F4; margin: 12px 0; }
#gameOver .skin-used { color: #5f6368; font-size: 14px; margin-bottom: 24px; }
#gameOver button {
  width: 100%; padding: 12px; margin: 6px 0;
  border: none; border-radius: 24px;
  font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.15s;
}
#restartBtn { background: #4285F4; color: white; }
#restartBtn:hover { background: #3367d6; }
#changeSkinBtn { background: #f1f3f4; color: #202124; }
#changeSkinBtn:hover { background: #e0e0e0; }
@media (max-width: 600px) {
  #selector h1 { font-size: 48px; }
  #skinGrid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
  #playBtn { padding: 14px 48px; font-size: 18px; }
}
</style>
</head>
<body>

<div id="selector">
  <h1>SNAKE</h1>
  <div class="subtitle">Choose your Chapter 1 skin</div>
  <div id="skinGrid"></div>
  <button id="playBtn">PLAY</button>
</div>

<div id="game">
  <div id="scoreBar">
    <div class="left">
      <svg width="20" height="20" viewBox="0 0 20 20">
        <circle cx="10" cy="12" r="7" fill="#e23636"/>
        <ellipse cx="12.5" cy="5.5" rx="2.2" ry="3.2" fill="#4a7c2e" transform="rotate(20 12.5 5.5)"/>
        <circle cx="8" cy="10" r="2" fill="rgba(255,255,255,0.25)"/>
      </svg>
      <span id="scoreText">0</span>
    </div>
    <span id="skinNameDisplay">Default</span>
    <button id="musicBtn">♪ OFF</button>
  </div>
  <canvas id="gameCanvas"></canvas>
</div>

<div id="gameOver">
  <div class="panel">
    <h2>Game Over</h2>
    <div class="final-score" id="finalScore">0</div>
    <div class="skin-used" id="finalSkin">Default</div>
    <button id="restartBtn">PLAY AGAIN</button>
    <button id="changeSkinBtn">CHANGE SKIN</button>
  </div>
</div>

<script>
(function () {
'use strict';

// ── SKINS ──────────────────────────────────────────────────────────────────
const SKINS = [
  { id:'default',  name:'Default',         primary:'#5b6770', secondary:'#3a4750', head:'#4a90e2', pattern:'solid'   },
  { id:'recon',    name:'Recon Expert',    primary:'#8b6f47', secondary:'#5d4a2f', head:'#c9a875', pattern:'stripe'  },
  { id:'skull',    name:'Skull Trooper',   primary:'#1a1a1a', secondary:'#ececec', head:'#ffffff', pattern:'checker' },
  { id:'ghoul',    name:'Ghoul Trooper',   primary:'#5fa84a', secondary:'#3a6b2e', head:'#e07ab8', pattern:'stripe'  },
  { id:'renegade', name:'Renegade Raider', primary:'#e8862a', secondary:'#a13d1b', head:'#ffb347', pattern:'stripe'  },
  { id:'knight',   name:'Black Knight',    primary:'#2c2c2c', secondary:'#1a1a1a', head:'#8b1a1a', pattern:'solid'   },
  { id:'omega',    name:'Omega',           primary:'#2a1a4a', secondary:'#1a0f30', head:'#5ad8ff', pattern:'glow'    },
  { id:'drift',    name:'Drift',           primary:'#e85a1a', secondary:'#ffffff', head:'#ff9933', pattern:'stripe'  },
  { id:'wick',     name:'John Wick',       primary:'#0d0d0d', secondary:'#2a2a2a', head:'#d4af37', pattern:'stripe'  },
  { id:'rust',     name:'Rust Lord',       primary:'#b85a1a', secondary:'#5d3a1a', head:'#ff8c2a', pattern:'checker' },
  { id:'raptor',   name:'Raptor',          primary:'#4a5d2a', secondary:'#2a3d1a', head:'#8b6f47', pattern:'stripe'  },
];

function segColor(skin, i, gx, gy, isHead) {
  if (isHead) return skin.head;
  let c = skin.primary;
  if (skin.pattern === 'stripe'  && i % 2 === 1)          c = skin.secondary;
  if (skin.pattern === 'checker' && (gx + gy) % 2 === 0)  c = skin.secondary;
  if (skin.pattern === 'glow'    && i % 3 === 0)           c = skin.head;
  return c;
}

function roundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x+w, y,   x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x,   y+h, r);
  ctx.arcTo(x,   y+h, x,   y,   r);
  ctx.arcTo(x,   y,   x+w, y,   r);
  ctx.closePath();
}

// ── SKIN PREVIEW ──────────────────────────────────────────────────────────
function drawSkinPreview(cv, skin) {
  const ctx = cv.getContext('2d');
  cv.width = 140; cv.height = 80;
  const cell = 10;
  for (let y = 0; y < 8; y++) for (let x = 0; x < 14; x++) {
    ctx.fillStyle = (x+y)%2===0 ? '#aad751' : '#a2d149';
    ctx.fillRect(x*cell, y*cell, cell, cell);
  }
  const path = [[2,5],[3,5],[4,5],[5,5],[6,5],[6,4],[6,3],[7,3],[8,3],[9,3],[9,4],[9,5],[9,6],[10,6],[11,6]];
  for (let i = 0; i < path.length; i++) {
    const [gx, gy] = path[i];
    const isHead = i === path.length - 1;
    const color = segColor(skin, i, gx, gy, isHead);
    if (skin.id === 'omega') { ctx.shadowColor = skin.head; ctx.shadowBlur = 3; }
    ctx.fillStyle = color;
    roundRect(ctx, gx*cell+1, gy*cell+1, cell-2, cell-2, 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    if (isHead) {
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(gx*cell+cell*0.72, gy*cell+cell*0.28, 1.5, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(gx*cell+cell*0.72, gy*cell+cell*0.72, 1.5, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#222';
      ctx.beginPath(); ctx.arc(gx*cell+cell*0.78, gy*cell+cell*0.28, 0.9, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(gx*cell+cell*0.78, gy*cell+cell*0.72, 0.9, 0, Math.PI*2); ctx.fill();
    }
  }
  ctx.fillStyle = '#e23636';
  ctx.beginPath(); ctx.arc(12.5*cell, 6.5*cell, 3.5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#4a7c2e';
  ctx.beginPath(); ctx.ellipse(12.5*cell+2, 6.5*cell-3, 2, 1, -0.5, 0, Math.PI*2); ctx.fill();
}

// ── SELECTOR ──────────────────────────────────────────────────────────────
let selectedSkin = SKINS[0];
const skinGrid = document.getElementById('skinGrid');
SKINS.forEach((skin, idx) => {
  const card = document.createElement('div');
  card.className = 'skin-card' + (idx === 0 ? ' selected' : '');
  const cv = document.createElement('canvas');
  card.appendChild(cv);
  const nm = document.createElement('div');
  nm.className = 'skin-name';
  nm.textContent = skin.name;
  card.appendChild(nm);
  skinGrid.appendChild(card);
  drawSkinPreview(cv, skin);
  card.addEventListener('click', () => {
    document.querySelectorAll('.skin-card').forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
    selectedSkin = skin;
  });
});

// ── AUDIO ─────────────────────────────────────────────────────────────────
let audioCtx = null;
function ac() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  return audioCtx;
}

function playEat() {
  try {
    const a = ac();
    const osc = a.createOscillator(), g = a.createGain();
    osc.connect(g); g.connect(a.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(600, a.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1300, a.currentTime + 0.07);
    g.gain.setValueAtTime(0.22, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.12);
    osc.start(); osc.stop(a.currentTime + 0.12);
  } catch(e) {}
}

function playDeath() {
  try {
    const a = ac();
    const bufSize = Math.floor(a.sampleRate * 0.45);
    const buf = a.createBuffer(1, bufSize, a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/bufSize, 1.5);
    const src = a.createBufferSource();
    src.buffer = buf;
    const flt = a.createBiquadFilter();
    flt.type = 'bandpass'; flt.frequency.setValueAtTime(350, a.currentTime);
    flt.frequency.exponentialRampToValueAtTime(80, a.currentTime + 0.45);
    const g = a.createGain();
    g.gain.setValueAtTime(0.5, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.45);
    src.connect(flt); flt.connect(g); g.connect(a.destination);
    src.start();
    const osc = a.createOscillator(), g2 = a.createGain();
    osc.connect(g2); g2.connect(a.destination);
    osc.type = 'square';
    osc.frequency.setValueAtTime(380, a.currentTime);
    osc.frequency.exponentialRampToValueAtTime(60, a.currentTime + 0.45);
    g2.gain.setValueAtTime(0.12, a.currentTime);
    g2.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.45);
    osc.start(); osc.stop(a.currentTime + 0.45);
  } catch(e) {}
}

let musicOn = false, musicTimer = null, melodyIdx = 0;
const MELODY = [523,659,784,659,523,587,698,587,523,659,784,880,784,659,523,440];
const NOTE_MS = 125;

function scheduleNote() {
  if (!musicOn) return;
  try {
    const a = ac();
    const freq = MELODY[melodyIdx++ % MELODY.length];
    const osc = a.createOscillator(), g = a.createGain();
    osc.connect(g); g.connect(a.destination);
    osc.type = 'square'; osc.frequency.value = freq;
    g.gain.setValueAtTime(0.04, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + NOTE_MS*0.8/1000);
    osc.start(); osc.stop(a.currentTime + NOTE_MS/1000);
  } catch(e) {}
  musicTimer = setTimeout(scheduleNote, NOTE_MS);
}

function startMusic() { if (musicOn) return; musicOn = true; melodyIdx = 0; scheduleNote(); }
function stopMusic()  { musicOn = false; if (musicTimer) { clearTimeout(musicTimer); musicTimer = null; } }

document.getElementById('musicBtn').addEventListener('click', () => {
  if (musicOn) { stopMusic(); document.getElementById('musicBtn').textContent = '♪ OFF'; }
  else         { startMusic(); document.getElementById('musicBtn').textContent = '♪ ON'; }
});

// ── GAME ──────────────────────────────────────────────────────────────────
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const COLS = 17, ROWS = 17;
let CELL = 30;

let snake, prevSnake, dir, nextDir, food, score, alive, lastTick, tickInterval, animId;

function resizeCanvas() {
  const barH = 44;
  const maxW = Math.min(window.innerWidth - 8, 600);
  const maxH = window.innerHeight - barH - 16;
  CELL = Math.floor(Math.min(maxW, maxH) / COLS);
  const sz = CELL * COLS;
  canvas.width = sz; canvas.height = sz;
  document.getElementById('scoreBar').style.width = sz + 'px';
}

function initGame() {
  resizeCanvas();
  ac(); // wake audio context on user gesture
  const mx = Math.floor(COLS/2), my = Math.floor(ROWS/2);
  snake = [{x:mx-2,y:my},{x:mx-1,y:my},{x:mx,y:my}];
  prevSnake = snake.map(s => ({...s}));
  dir = {x:1,y:0}; nextDir = {x:1,y:0};
  score = 0; alive = true; tickInterval = 150;
  spawnFood();
  updateScoreUI();
  lastTick = performance.now();
  if (animId) cancelAnimationFrame(animId);
  animId = requestAnimationFrame(gameLoop);
}

function spawnFood() {
  const occ = new Set(snake.map(s => s.x+','+s.y));
  let fx, fy;
  do { fx = Math.floor(Math.random()*COLS); fy = Math.floor(Math.random()*ROWS); }
  while (occ.has(fx+','+fy));
  food = {x:fx, y:fy};
}

function updateScoreUI() {
  document.getElementById('scoreText').textContent = score;
  document.getElementById('skinNameDisplay').textContent = selectedSkin.name;
}

function step() {
  prevSnake = snake.map(s => ({x:s.x, y:s.y}));
  dir = nextDir;
  const head = snake[snake.length-1];
  const nx = head.x + dir.x, ny = head.y + dir.y;
  if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) { playDeath(); return gameOver(); }
  for (let i = 0; i < snake.length; i++) {
    if (snake[i].x === nx && snake[i].y === ny) { playDeath(); return gameOver(); }
  }
  snake.push({x:nx, y:ny});
  if (nx === food.x && ny === food.y) {
    score++;
    playEat();
    spawnFood();
    tickInterval = Math.max(80, 150 - score*3);
    updateScoreUI();
  } else {
    snake.shift();
  }
}

function lerp(a, b, t) { return a + (b-a)*t; }

function draw(now) {
  const t = Math.min(1, (now - lastTick) / tickInterval);

  // Board
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    ctx.fillStyle = (x+y)%2===0 ? '#aad751' : '#a2d149';
    ctx.fillRect(x*CELL, y*CELL, CELL, CELL);
  }

  // Apple
  const fx = food.x*CELL + CELL/2, fy = food.y*CELL + CELL/2, fr = CELL*0.38;
  ctx.fillStyle = '#e23636';
  ctx.beginPath(); ctx.arc(fx, fy, fr, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.28)';
  ctx.beginPath(); ctx.arc(fx - fr*0.28, fy - fr*0.32, fr*0.36, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#4a7c2e';
  ctx.beginPath(); ctx.ellipse(fx+fr*0.28, fy-fr*0.88, fr*0.28, fr*0.13, -0.5, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#4a7c2e'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(fx, fy-fr*0.88); ctx.lineTo(fx+fr*0.2, fy-fr*1.2); ctx.stroke();

  // Visual positions (lerped)
  const vp = snake.map((seg, i) => {
    const prev = i < prevSnake.length ? prevSnake[i] : prevSnake[prevSnake.length-1];
    return { x: lerp(prev.x, seg.x, t) * CELL, y: lerp(prev.y, seg.y, t) * CELL };
  });

  const skin = selectedSkin;
  const pad = Math.max(2, CELL * 0.06);
  const r   = Math.max(3, CELL * 0.22);

  // Connectors (fill gaps between segments)
  ctx.lineCap = 'round';
  for (let i = 0; i < snake.length - 1; i++) {
    const isHead1 = i === snake.length - 2;
    const color = segColor(skin, i, snake[i].x, snake[i].y, false);
    if (skin.id === 'omega') { ctx.shadowColor = skin.head; ctx.shadowBlur = 5; }
    ctx.strokeStyle = color;
    ctx.lineWidth = CELL - pad*2;
    ctx.beginPath();
    ctx.moveTo(vp[i].x + CELL/2, vp[i].y + CELL/2);
    ctx.lineTo(vp[i+1].x + CELL/2, vp[i+1].y + CELL/2);
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  // Segments
  for (let i = 0; i < snake.length; i++) {
    const isHead = i === snake.length - 1;
    const seg = snake[i];
    const color = segColor(skin, i, seg.x, seg.y, isHead);
    if (skin.id === 'omega') { ctx.shadowColor = skin.head; ctx.shadowBlur = 8; }
    ctx.fillStyle = color;
    roundRect(ctx, vp[i].x + pad, vp[i].y + pad, CELL - pad*2, CELL - pad*2, r);
    ctx.fill();
    ctx.shadowBlur = 0;

    if (isHead) {
      const cx = vp[i].x + CELL/2, cy = vp[i].y + CELL/2;
      const er = Math.max(2, CELL * 0.11);
      let e1x, e1y, e2x, e2y;
      if      (dir.x ===  1) { e1x=cx+CELL*0.15; e1y=cy-CELL*0.18; e2x=cx+CELL*0.15; e2y=cy+CELL*0.18; }
      else if (dir.x === -1) { e1x=cx-CELL*0.15; e1y=cy-CELL*0.18; e2x=cx-CELL*0.15; e2y=cy+CELL*0.18; }
      else if (dir.y === -1) { e1x=cx-CELL*0.18; e1y=cy-CELL*0.15; e2x=cx+CELL*0.18; e2y=cy-CELL*0.15; }
      else                   { e1x=cx-CELL*0.18; e1y=cy+CELL*0.15; e2x=cx+CELL*0.18; e2y=cy+CELL*0.15; }
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(e1x, e1y, er, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(e2x, e2y, er, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#222';
      ctx.beginPath(); ctx.arc(e1x+dir.x*er*0.35, e1y+dir.y*er*0.35, er*0.55, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(e2x+dir.x*er*0.35, e2y+dir.y*er*0.35, er*0.55, 0, Math.PI*2); ctx.fill();
    }
  }
}

function gameLoop(now) {
  if (!alive) return;
  animId = requestAnimationFrame(gameLoop);
  if (now - lastTick >= tickInterval) {
    lastTick = now;
    step();
    if (!alive) return;
  }
  draw(now);
}

function gameOver() {
  alive = false;
  cancelAnimationFrame(animId);
  document.getElementById('finalScore').textContent = score;
  document.getElementById('finalSkin').textContent = 'Skin: ' + selectedSkin.name;
  document.getElementById('gameOver').style.display = 'flex';
}

// ── CONTROLS ──────────────────────────────────────────────────────────────
function setDir(dx, dy) {
  if (dx === -nextDir.x && dy === -nextDir.y) return;
  nextDir = {x:dx, y:dy};
}

window.addEventListener('keydown', e => {
  if      (e.key==='ArrowUp'    || e.key==='w' || e.key==='W') { setDir(0,-1);  e.preventDefault(); }
  else if (e.key==='ArrowDown'  || e.key==='s' || e.key==='S') { setDir(0, 1);  e.preventDefault(); }
  else if (e.key==='ArrowLeft'  || e.key==='a' || e.key==='A') { setDir(-1, 0); e.preventDefault(); }
  else if (e.key==='ArrowRight' || e.key==='d' || e.key==='D') { setDir(1,  0); e.preventDefault(); }
});

let tx0 = 0, ty0 = 0;
canvas.addEventListener('touchstart', e => { tx0=e.touches[0].clientX; ty0=e.touches[0].clientY; e.preventDefault(); }, {passive:false});
canvas.addEventListener('touchmove',  e => e.preventDefault(), {passive:false});
canvas.addEventListener('touchend',   e => {
  const dx = e.changedTouches[0].clientX - tx0, dy = e.changedTouches[0].clientY - ty0;
  if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
  if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
  else setDir(0, dy > 0 ? 1 : -1);
}, {passive:false});

window.addEventListener('resize', () => {
  if (document.getElementById('game').style.display === 'flex') {
    resizeCanvas();
    if (!alive) draw(performance.now());
  }
});

// ── SCREEN TRANSITIONS ────────────────────────────────────────────────────
document.getElementById('playBtn').addEventListener('click', () => {
  document.getElementById('selector').style.display = 'none';
  document.getElementById('game').style.display = 'flex';
  initGame();
});
document.getElementById('restartBtn').addEventListener('click', () => {
  document.getElementById('gameOver').style.display = 'none';
  initGame();
});
document.getElementById('changeSkinBtn').addEventListener('click', () => {
  document.getElementById('gameOver').style.display = 'none';
  document.getElementById('game').style.display = 'none';
  document.getElementById('selector').style.display = 'flex';
});

})();
</script>
</body>
</html>
